# ============================================
# Nginx config for calendarsolunar.ro
# Place at: /etc/nginx/sites-available/calendarsolunar.ro
# Symlink:  ln -s /etc/nginx/sites-available/calendarsolunar.ro /etc/nginx/sites-enabled/
# ============================================

# ----- Upstream: Next.js via PM2 -----
upstream nextjs_solunar {
    server 127.0.0.1:3500;
    keepalive 32;
}

# ----- Block 1: HTTP (port 80) — redirect ALL to HTTPS non-www -----
server {
    listen 80;
    listen [::]:80;
    server_name calendarsolunar.ro www.calendarsolunar.ro;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect everything else to HTTPS non-www
    location / {
        return 301 https://calendarsolunar.ro$request_uri;
    }
}

# ----- Block 2: HTTPS www — redirect to HTTPS non-www -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.calendarsolunar.ro;

    # SSL certificates (adjust paths to match your setup)
    ssl_certificate     /etc/letsencrypt/live/calendarsolunar.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendarsolunar.ro/privkey.pem;

    return 301 https://calendarsolunar.ro$request_uri;
}

# ----- Block 3: HTTPS non-www — main server -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calendarsolunar.ro;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/calendarsolunar.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendarsolunar.ro/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Next.js static assets — serve from disk, long cache
    location ^~ /_next/static/ {
        alias /var/www/solunar/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Public static files (images, fonts, etc.)
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|avif)$ {
        root /var/www/solunar/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://nextjs_solunar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main proxy to Next.js
    location / {
        proxy_pass http://nextjs_solunar;
        proxy_http_version 1.1;

        # Headers for Next.js middleware (www redirect, http->https detection)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (for HMR in dev, good practice)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }
}
